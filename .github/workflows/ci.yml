name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  # The anti-drift gate. `conformance/` is a vendored, read-only package pinned by
  # sha256; it is the shared contract between Bahi's JS engine and Folio's Ruby one.
  # Its own workflow lives at conformance/.github/ for when the package is extracted
  # to its own repo — that path is NOT picked up by Actions here, so this job is what
  # actually enforces the contract in Folio. Never edit conformance/ to make it pass.
  conformance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Full history: the read-only guard below diffs against a base commit, and
          # the default depth-1 checkout does not have one.
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install sqlite3 gem for the standalone Ruby adapter
        run: gem install sqlite3 --no-document

      - name: Tier C + R + F — JS adapter, Ruby adapter, format suite
        working-directory: conformance
        run: npm test

      # This previously ran `git diff --quiet HEAD -- conformance/`, which compares the
      # WORKING TREE to HEAD. On a CI checkout those are identical and `npm test` does
      # not write into conformance/, so the guard could only ever pass — including for
      # a PR that committed an edit to the package, since that edit is inside HEAD.
      # The one automated control over the Bahi<->Folio contract was inert. Diff
      # against the base commit instead.
      - name: Fail if the conformance package was modified
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No base commit to compare against (branch creation or first push) — skipping."
            exit 0
          fi
          if ! git diff --quiet "$BASE"...HEAD -- conformance/; then
            echo "::error::conformance/ is read-only — it is the anti-drift contract shared with Bahi. Changing it is a contract version bump, not a code change."
            git diff --stat "$BASE"...HEAD -- conformance/
            exit 1
          fi
          echo "conformance/ unchanged since $BASE."

  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  # scan_js REMOVED 2026-07-28: it ran `bin/importmap audit`, but the importmap
  # binstub was never generated (rails new --skip-bundle skipped the install
  # generators), so the job exited 127 on every run. There is no JavaScript in
  # this app yet. Restore it — with `bin/rails importmap:install` — when there is.

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: valkey/valkey:8
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare test

  # system-test REMOVED 2026-07-28: it ran `bin/rails test:system` against a
  # test/system/ directory that does not exist, failing with LoadError every
  # run. There are zero application routes, so there is nothing to drive. This
  # comes back with the entry system (Batch 4), which is the first thing a
  # human can actually click through.